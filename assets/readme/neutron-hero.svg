<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1360 365" role="img" aria-labelledby="title desc">
<title id="title">Neutron Client</title><desc id="desc">Neutron is a modular Minecraft 1.8.9 client. Dark glass UI with magenta and orange PinkLemonade accents.</desc>
<defs>
<linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="30%"><stop offset="0" stop-color="#FF00EA"/><stop offset=".56" stop-color="#FE2597"/><stop offset="1" stop-color="#FF6200"/></linearGradient>
<radialGradient id="glow1"><stop stop-color="#D500C6" stop-opacity=".35"/><stop offset="1" stop-color="#D500C6" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2"><stop stop-color="#F85D09" stop-opacity=".21"/><stop offset="1" stop-color="#F85D09" stop-opacity="0"/></radialGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#232232" stop-opacity=".95"/><stop offset="1" stop-color="#0E0E18" stop-opacity=".97"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#CDACDE" stroke-opacity=".085" stroke-width="1"/></pattern>
<filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".55"/></filter>
