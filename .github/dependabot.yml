version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:30'
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    labels: [dependencies]
    ignore:
      # ControllerEnvironment in this release requires Java 17. The client runs on Java 8.
      - dependency-name: 'net.java.jinput:jinput'
        versions: ['2.0.10']
    groups:
      compatible-updates:
        patterns: ['*']
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ['*']
