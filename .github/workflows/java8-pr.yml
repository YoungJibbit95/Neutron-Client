name: Java 8 PR regression

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: java8-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java8:
    name: Java 8 / Windows regression
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Temurin 8u482 (preferred release toolchain)
        id: temurin
        continue-on-error: true
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '8.0.482+8'
          architecture: x64
          check-latest: false

      # The full release-bundle job still verifies the exact Temurin 8u482.
      # Only the PR regression may use a checksum-verified independent Java 8
      # distribution when GitHub's Temurin release CDN returns HTTP 504.
      - name: Fallback Java 8 from Azul when Temurin release is unreachable
        if: steps.temurin.outcome == 'failure'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '8'
          architecture: x64
          check-latest: false

      - name: Enforce Java 8 compiler/runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $version = & "$env:JAVA_HOME/bin/java.exe" -version 2>&1 | Out-String
          Write-Host $version
          if ($version -notmatch '1\.8\.0_') { throw 'Java 8 was not installed. Release toolchain remains pinned to Temurin 8u482.' }
          & "$env:JAVA_HOME/bin/javac.exe" -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Maven 3.9.15 (verified Apache archive)
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'apache-maven-3.9.15-bin.zip'
          Invoke-WebRequest 'https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.15/apache-maven-3.9.15-bin.zip' -OutFile $zip -MaximumRetryCount 2 -RetryIntervalSec 3 -TimeoutSec 60
          $expected = '251c676eb88684d6dd86c666817979d256a335c31ad34ab0e1df17eeca1cd504a6c890e906a46d04e51cc7a4fb02f33a75971ef750558034e0a81c257be02267'
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA512).Hash -ne $expected) { throw 'Maven archive checksum mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP
          "MAVEN_HOME=$(Join-Path $env:RUNNER_TEMP 'apache-maven-3.9.15')" >> $env:GITHUB_ENV

      - name: Record exact revision and tools
        run: |
          git rev-parse HEAD
          & "$env:JAVA_HOME/bin/java.exe" -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:MAVEN_HOME/bin/mvn.cmd" --version
          exit $LASTEXITCODE

      - name: Full Java 8 regression (fresh Maven repository)
        run: |
          $ErrorActionPreference = 'Stop'
          $started = (Get-Date).ToString('o')
          $repository = Join-Path $env:RUNNER_TEMP 'neutron-java8-m2'
          & "$env:MAVEN_HOME/bin/mvn.cmd" -B -ntp '-Dstyle.color=never' "-Dmaven.repo.local=$repository" test 2>&1 |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'java8-pr-maven.log')
          $mavenExit = $LASTEXITCODE
          # Hosted regression deliberately leaves the three existing opt-in GL tests disabled.
          # They require a separately evidenced native context; no new skip is accepted here.
          & .github/scripts/check-java8-results.ps1 -Since $started
          if ($mavenExit -ne 0) { exit $mavenExit }

      - name: Retain test evidence (no client/runtime data)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java8-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/TEST-*.xml
            target/surefire-reports/*.txt
            target/ci-java8-summary.json
            ${{ runner.temp }}/java8-pr-maven.log
          if-no-files-found: error
          retention-days: 14
