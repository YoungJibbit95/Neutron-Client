name: Launcher Windows candidate
on:
  pull_request:
    paths: ['launcher/**', '.github/workflows/launcher-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: launcher
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.3.1'
      - name: Isolated build directories
        run: |
          $directories = @{
            TEMP = 'neutron-temp'; TMP = 'neutron-temp'; npm_config_cache = 'neutron-npm'
            NEUTRON_VITE_CACHE = 'neutron-vite'; ELECTRON_CACHE = 'neutron-electron'
            ELECTRON_BUILDER_CACHE = 'neutron-builder'; NEUTRON_PACKAGE_OUTPUT = 'neutron-installer'
          }
          foreach ($key in $directories.Keys) {
            $directory = Join-Path $env:RUNNER_TEMP $directories[$key]
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            "$key=$directory" >> $env:GITHUB_ENV
          }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/build.mjs
      - run: node node_modules/vitest/vitest.mjs run
      - name: Storage preflight regression fixtures (Windows PowerShell 5.1)
        run: '& "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File scripts/test-storage-preflight.ps1; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
      - name: Storage fixtures in the 32-bit installer PowerShell
        run: '& "$env:SystemRoot\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File scripts/test-storage-preflight.ps1; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
      - name: Check the tracked durable Alpha source pin
        run: node scripts/pin-alpha.mjs --check
      - name: Package Windows NSIS candidate (log exact tool downloads)
        run: node scripts/package-windows.mjs
        env:
          DEBUG: electron-builder*
      - name: Install, start, reinstall and uninstall the actual candidate
        run: ./scripts/windows-installer-smoke.ps1
      - name: Installer checksum
        run: Get-ChildItem -Path (Join-Path $env:NEUTRON_PACKAGE_OUTPUT '*.exe') -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unsigned-windows-candidate
          path: |
            ${{ runner.temp }}\neutron-installer\*.exe
            ${{ runner.temp }}\neutron-installer\installer-acceptance.json
            ${{ runner.temp }}\neutron-installer\installer-standard-user.log
          retention-days: 7
          if-no-files-found: error
