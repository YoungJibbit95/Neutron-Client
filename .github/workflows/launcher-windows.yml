name: Launcher Windows candidate
on:
  pull_request:
    paths: ['launcher/**', '.github/workflows/launcher-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: launcher
        shell: pwsh
    env:
      TEMP: ${{ runner.temp }}\neutron-temp
      TMP: ${{ runner.temp }}\neutron-temp
      npm_config_cache: ${{ runner.temp }}\neutron-npm
      NEUTRON_VITE_CACHE: ${{ runner.temp }}\neutron-vite
      ELECTRON_CACHE: ${{ runner.temp }}\neutron-electron
      ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\neutron-builder
      NEUTRON_PACKAGE_OUTPUT: ${{ runner.temp }}\neutron-installer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.3.1'
      - run: New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/build.mjs
      - run: node node_modules/vitest/vitest.mjs run
      - run: node scripts/package-windows.mjs
      - name: Installer checksum
        run: Get-ChildItem -Path (Join-Path $env:NEUTRON_PACKAGE_OUTPUT '*.exe') -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-windows-candidate
          path: ${{ runner.temp }}\neutron-installer\*.exe
          retention-days: 7
          if-no-files-found: error
