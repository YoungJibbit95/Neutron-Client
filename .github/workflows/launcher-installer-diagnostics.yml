name: Legacy launcher installer diagnosis
on:
  pull_request:
    paths: ['launcher/scripts/*diagnostic.ps1', 'launcher/scripts/installer-ui.cs', '.github/workflows/launcher-installer-diagnostics.yml']
permissions:
  contents: read
concurrency:
  group: launcher-legacy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  legacy:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Observe public 0.2.0 to public 0.2.2 in a real ordinary account
        shell: pwsh
        run: ./launcher/scripts/run-installer-legacy-diagnostic.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: legacy-installer-diagnostic
          path: |
            ${{ runner.temp }}\neutron-legacy-*\legacy-diagnostic.json
            ${{ runner.temp }}\neutron-legacy-*\diagnostic.log
          if-no-files-found: error
          retention-days: 7
