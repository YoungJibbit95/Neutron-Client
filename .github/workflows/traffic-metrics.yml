name: Neutron · GitHub traffic badges

on:
  workflow_dispatch:
  schedule:
    # Daily at 04:23 UTC; off the busy start of the hour.
    - cron: '23 04 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/traffic-metrics.yml'
      - '.github/scripts/*traffic*'

permissions:
  contents: read

concurrency:
  group: neutron-traffic-badges
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'YoungJibbit95/Neutron-Client' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check traffic access configuration
        env:
          NEUTRON_TRAFFIC_TOKEN: ${{ secrets.NEUTRON_TRAFFIC_TOKEN }}
        run: |
          if [ -z "$NEUTRON_TRAFFIC_TOKEN" ]; then
            echo '::error::Set NEUTRON_TRAFFIC_TOKEN with Administration: read to enable daily traffic updates.'
            echo 'Traffic refresh needs NEUTRON_TRAFFIC_TOKEN. Existing badges are kept. See docs/README_ASSETS.md.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout badge tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Update verified 14-day traffic badges
        env:
          NEUTRON_TRAFFIC_TOKEN: ${{ secrets.NEUTRON_TRAFFIC_TOKEN }}
        run: python3 -B .github/scripts/update_traffic_badges.py

      - name: Publish both badges to the metrics branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          python3 -B .github/scripts/publish_traffic_badges.py
          echo 'Traffic badges refreshed on readme-metrics. The README reads this branch directly; no badge PR merge is needed.' >> "$GITHUB_STEP_SUMMARY"
