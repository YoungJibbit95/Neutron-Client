name: Neutron · GitHub traffic badges

on:
  workflow_dispatch:
  schedule:
    - cron: '23 04 * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: neutron-traffic-badges
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'YoungJibbit95/Neutron-Client'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      NEUTRON_TRAFFIC_TOKEN: ${{ secrets.NEUTRON_TRAFFIC_TOKEN }}
    steps:
      - name: Check traffic access configuration
        id: token
        run: |
          if [ -n "$NEUTRON_TRAFFIC_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Set NEUTRON_TRAFFIC_TOKEN with Administration: read to enable traffic updates.'
            echo 'Traffic refresh needs NEUTRON_TRAFFIC_TOKEN. See docs/README_ASSETS.md.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout default branch
        if: steps.token.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare dedicated badge branch
        if: steps.token.outputs.configured == 'true'
        run: |
          gh auth setup-git --hostname github.com
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/codex/readme-traffic; then
            git switch --track origin/codex/readme-traffic
            git merge --no-edit "origin/$DEFAULT_BRANCH"
          else
            git switch -c codex/readme-traffic
          fi
          unexpected=$(git diff --name-only "origin/$DEFAULT_BRANCH"...HEAD -- . ':(exclude)assets/readme/metrics/views-14d.svg' ':(exclude)assets/readme/metrics/clones-14d.svg')
          if [ -n "$unexpected" ]; then
            echo '::error::The badge branch contains unrelated changes; refusing to publish it.'
            exit 1
          fi

      - name: Update verified 14-day traffic badges
        if: steps.token.outputs.configured == 'true'
        run: python3 .github/scripts/update_traffic_badges.py

      - name: Commit badges and open or update pull request
        if: steps.token.outputs.configured == 'true'
        run: |
          git add assets/readme/metrics/views-14d.svg assets/readme/metrics/clones-14d.svg
          if ! git diff --cached --quiet; then
            git commit -m 'docs(metrics): refresh 14-day repo traffic badges'
          fi
          if git diff --quiet "origin/$DEFAULT_BRANCH" -- assets/readme/metrics; then
            echo 'Traffic badge files unchanged.'
            exit 0
          fi
          git push origin HEAD:refs/heads/codex/readme-traffic
          existing=$(gh pr list --head codex/readme-traffic --base "$DEFAULT_BRANCH" --state open --json number --jq 'length')
          if [ "$existing" = '0' ]; then
            gh pr create --head codex/readme-traffic --base "$DEFAULT_BRANCH" --title 'docs: refresh repository traffic badges' --body 'Updates repository views and clones from the GitHub traffic API. Numbers cover the last 14 days; the SVGs include the UTC update date.'
          fi

          # Token-created PRs may wait for manual workflow approval. Dispatch the
          # same read-only Java 8 check explicitly on this trusted badge branch.
          gh workflow run java8-pr.yml --ref codex/readme-traffic
          gh workflow run repository-policy.yml --ref codex/readme-traffic
