name: Repository security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Policy and release tooling tests
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Install checksum-locked linters
        id: locked_tools
        shell: bash
        run: |
          set +e
          python3 -B .github/scripts/install_workflow_tools.py --destination "$RUNNER_TEMP/workflow-tools"
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo 'registry_fallback=true' >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      - name: Recover pinned linters from independently verified registries
        if: steps.locked_tools.outputs.registry_fallback == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workflow-tools" "$RUNNER_TEMP/zizmor-wheels"
          # Go verifies the module chain via sum.golang.org; no VCS HEAD or latest.
          GOBIN="$RUNNER_TEMP/workflow-tools" GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
            go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # Same zizmor 1.31.1 as the GitHub asset, with the exact official
          # PyPI Linux wheel SHA-256 pinned; never fall back to source builds.
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/python" -m pip download --no-deps --only-binary=:all: \
            --index-url https://pypi.org/simple --dest "$RUNNER_TEMP/zizmor-wheels" 'zizmor==1.31.1'
          wheel="$RUNNER_TEMP/zizmor-wheels/zizmor-1.31.1-py3-none-manylinux_2_28_x86_64.whl"
          test -f "$wheel"
          echo "58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410  $wheel" | sha256sum -c -
          "$RUNNER_TEMP/zizmor-venv/bin/python" -m pip install --no-index --no-deps --no-compile "$wheel"
          ln -s "$RUNNER_TEMP/zizmor-venv/bin/zizmor" "$RUNNER_TEMP/workflow-tools/zizmor"
          "$RUNNER_TEMP/workflow-tools/actionlint" -version
          "$RUNNER_TEMP/workflow-tools/zizmor" --version
      - name: Workflow syntax and shell checks
        run: '"$RUNNER_TEMP/workflow-tools/actionlint"'
      - name: Workflow security checks
        run: '"$RUNNER_TEMP/workflow-tools/zizmor" --offline --min-severity medium .github/workflows'

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve comparison commits
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          base="${PR_BASE:-$(gh api "repos/$GH_REPO/commits/main" --jq .sha)}"
          head="${PR_HEAD:-$(git rev-parse HEAD)}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: Reject newly introduced high or critical vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ steps.revisions.outputs.base }}
          head-ref: ${{ steps.revisions.outputs.head }}
          fail-on-severity: high
          comment-summary-in-pr: never
