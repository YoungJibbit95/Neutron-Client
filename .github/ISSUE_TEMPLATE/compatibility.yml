name: Anti-cheat compatibility
description: Record an Intave, Polar or other anti-cheat regression with its test environment.
labels: [anticheat, needs-triage]
body:
  - type: dropdown
    id: anticheat
    attributes:
      label: Anti-cheat
      options: [Intave, Polar, Other]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Anti-cheat build, configuration and server environment
      description: Include the test date and server/game version. Write unknown where details are unavailable.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client version or commit
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Reproduction and comparison
      description: List modules/modes/settings, steps, expected and observed behavior, and a prior working baseline if known.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Test evidence and remaining limits
      description: Attach redacted diagnostics or recordings. Identify untested combinations; a single successful session is not universal coverage.
