name: Visual or input defect
description: A GUI/HUD, theme, animation, clipping or input problem.
labels: [bug, visuals, needs-triage]
body:
  - type: input
    id: version
    attributes:
      label: Client version or commit
    validations:
      required: true
  - type: textarea
    id: display
    attributes:
      label: Screen and display settings
      placeholder: Screen/GUI layout, resolution, GUI scale, theme, OS/GPU and shaderpack if relevant
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected appearance and actual behavior
      description: For input issues, include mouse/keyboard actions and which control receives them.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or short recording
      description: Include the full affected area and remove account or other private data.
