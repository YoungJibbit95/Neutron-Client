name: Feature proposal
description: Propose a focused improvement with a clear use case.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and acceptance criteria
      description: Describe how a user would use it and how we can tell it works.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or existing behavior
